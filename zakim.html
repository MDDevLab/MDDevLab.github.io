<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zakim – by MDDevLab</title>
<meta name="description" content="Zakim by MDDevLab – free battery pack builder for Li-ion, LiFePO4 and NiMH cells.">

<style>
  :root{
    --navy:#01183A; --navy-deep:#000F26; --card:#06244F; --card-line:#0B3670;
    --blue-deep:#012B8E; --blue:#0398ED; --sky:#05ACE2; --turq:#06B9C5;
    --text:#F2F7FF; --muted:#A9C4E6;
    --grad:linear-gradient(90deg,#0398ED,#05ACE2,#06B9C5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--navy-deep);color:var(--text);line-height:1.6;
  }
  a{color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}

  /* Header */
  header{position:sticky;top:0;z-index:10;background:rgba(0,15,38,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--card-line)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
  .brand{font-weight:800;font-size:1.35rem;text-decoration:none;letter-spacing:.2px}
  .brand .lab,.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  nav{display:flex;gap:22px}
  nav a{text-decoration:none;color:var(--muted);font-size:.95rem}
  nav a:hover{color:var(--text)}
  .lang{display:flex;border:1px solid var(--card-line);border-radius:8px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);padding:6px 10px;
    font:inherit;font-size:.85rem;cursor:pointer}
  .lang button.on{background:var(--blue-deep);color:#fff}

  /* Hero */
  .hero{padding:96px 0 80px;text-align:center;
    background:radial-gradient(ellipse at top,rgba(3,152,237,.22),transparent 60%),var(--navy)}
  .hero h1{font-size:clamp(2.6rem,8vw,4.4rem);font-weight:800;line-height:1.1}
  .slogan{margin-top:10px;font-size:.85rem;letter-spacing:.32em;color:var(--sky);font-weight:600}
  .hero p.lead{max-width:640px;margin:28px auto 0;font-size:1.15rem;color:var(--muted)}
  .badges{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:32px}
  .badge{border:1px solid var(--card-line);background:var(--card);border-radius:999px;
    padding:8px 16px;font-size:.92rem}
  .badge b{color:var(--turq)}

  /* Sections */
  section{padding:80px 0}
  section.alt{background:var(--navy)}
  h2{font-size:clamp(1.7rem,4vw,2.2rem);margin-bottom:8px}
  .line{width:56px;height:4px;border-radius:2px;background:var(--grad);margin-bottom:32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
  .card{background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:28px}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .icon{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;
    background:rgba(3,152,237,.14);color:var(--sky)}
  .soon{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--navy-deep);background:var(--grad);padding:5px 12px;border-radius:999px}
  .card h3{font-size:1.35rem}
  .by{font-size:.85rem;color:var(--muted);margin-bottom:12px}
  .card p{color:var(--muted)}
  .about p{max-width:720px;color:var(--muted);font-size:1.08rem;margin-bottom:16px}
  .about strong{color:var(--text)}
  .contact{text-align:center}
  .contact .line{margin:0 auto 28px}
  .contact p{color:var(--muted);font-size:1.08rem}
  .mail{display:inline-block;margin-top:24px;padding:14px 28px;border-radius:12px;
    background:var(--grad);color:var(--navy-deep);font-weight:700;text-decoration:none;font-size:1.05rem}
  .mail:hover{filter:brightness(1.08)}

  footer{border-top:1px solid var(--card-line);padding:28px 0;text-align:center;
    color:var(--muted);font-size:.88rem}

  @media (max-width:720px){
    nav{display:none}
    .hero{padding:72px 0 60px}
    section{padding:60px 0}
  }

  .brand{display:flex;align-items:center;gap:10px}
  .brand img{height:34px;width:auto;border-radius:8px;display:block}
  .banner{display:block;width:100%;height:auto;border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);border:1px solid var(--card-line)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hero{padding:48px 0 72px}
  @media (max-width:720px){.hero{padding:24px 0 52px}.banner{border-radius:12px}}
  .rec-tag{font-size:.78rem;font-weight:700;color:var(--turq);border:1px solid var(--turq);
    padding:4px 10px;border-radius:999px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{display:inline-block;padding:9px 16px;border-radius:10px;text-decoration:none;font-weight:600;font-size:.92rem}
  .btn.main{background:var(--grad);color:var(--navy-deep)}
  .btn.ghost{border:1px solid var(--card-line);color:var(--text)}
  .btn:hover{filter:brightness(1.1)}
</style>
<style>
  .back{color:var(--muted);text-decoration:none;font-size:.95rem}
  .back:hover{color:var(--text)}
  .p-hero{padding:56px 0 24px}
  .p-hero h1{font-size:clamp(2.2rem,6vw,3.2rem);line-height:1.15}
  .p-hero .by{color:var(--muted);margin:4px 0 18px}
  .p-hero p{color:var(--muted);font-size:1.12rem;max-width:720px}
  .shots{display:grid;gap:28px}
  figure img{width:100%;height:auto;border-radius:14px;border:1px solid var(--card-line);
    box-shadow:0 16px 40px rgba(0,0,0,.4);display:block}
  figcaption{color:var(--muted);font-size:.95rem;margin-top:10px;text-align:center}
  .mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .mod{background:var(--card);border:1px solid var(--card-line);border-radius:14px;padding:20px}
  .mod h3{font-size:1.08rem;margin-bottom:6px}
  .mod p{color:var(--muted);font-size:.95rem}
  .note{margin-top:28px;color:var(--muted);text-align:center}
</style>
</head>
